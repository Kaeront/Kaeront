<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaeront | Настройки</title>
    <link rel="icon" type="image/png" href="https://kaeront.ru/assets/id.png">
    
    <style>
        :root {
            --nav-hide: 80px;
            --st-bg: #080808;
            --st-text: #ececec;
            --st-text-dim: #777;
            --st-card-bg: rgba(18, 18, 18, 0.85);
            --st-border: #222;
            --st-user-bg: #111;
            --st-user-border: #252525;
            --st-table-bg: #0f0f0f;
            --st-table-border: #1a1a1a;
            --st-btn-sec-bg: #1a1a1a;
            --st-btn-sec-color: #ccc;
            --st-btn-sec-hover: #252525;
            --st-modal-bg: #111;
            --st-modal-border: #2a2a2a;
        }

        html.light-theme, body.light-theme {
            --st-bg: #f4f4f5;
            --st-text: #18181b;
            --st-text-dim: #71717a;
            --st-card-bg: rgba(255, 255, 255, 0.85);
            --st-border: #e4e4e7;
            --st-user-bg: #ffffff;
            --st-user-border: #e4e4e7;
            --st-table-bg: #fafafa;
            --st-table-border: #f1f1f5;
            --st-btn-sec-bg: #e4e4e7;
            --st-btn-sec-color: #27272a;
            --st-btn-sec-hover: #d4d4d8;
            --st-modal-bg: #ffffff;
            --st-modal-border: #e4e4e7;
        }

        html {
            height: 100%;
        }

        body {
            display: none; /* Скрыто до валидации токена */
            background-color: var(--st-bg) !important;
            color: var(--st-text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        .page-container {
            max-width: 940px;
            margin: 120px auto 60px;
            padding: 0 20px;
            box-sizing: border-box;
            flex: 1 0 auto;
            width: 100%;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 230px 670px;
            gap: 10px;
            align-items: start;
            justify-content: center;
        }

        /* Сайдбар */
        .ks-sidebar {
            position: relative;
            background: var(--st-card-bg);
            border: 1px solid var(--st-border);
            border-radius: 40px 10px 0 40px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }

        .ks-sidebar::after {
            content: '';
            position: absolute;
            bottom: -40px;
            right: -1px;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 0 100%, transparent 0, transparent 39px, var(--st-border) 39px, var(--st-border) 40px, transparent 40px), radial-gradient(circle at 0 100%, transparent 0, transparent 40px, var(--st-card-bg) 40px);
            border-right: 1px solid var(--st-border);
            pointer-events: none;
            filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.15));
        }

        .ks-sidebar-title {
            font-size: 0.75rem;
            letter-spacing: 0.07em;
            color: var(--st-text-dim);
            font-weight: 700;
            margin-bottom: 12px;
            padding-left: 8px;
            font-family: 'Minecraft', sans-serif;
        }

        .ks-nav-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ks-nav-item {
            display: block;
            width: 100%;
            padding: 0;
            background: transparent;
            border: none;
            cursor: pointer;
            box-sizing: border-box;
            border-radius: 20px;
            user-select: none;
        }

        .ks-nav-inner {
            display: block;
            width: 100%;
            padding: 10px 20px;
            border-radius: 20px;
            color: var(--st-text-dim);
            font-size: 0.9rem;
            font-weight: 400;
            text-align: left;
            box-sizing: border-box;
            background: transparent;
            border: 1px solid transparent;
            user-select: none;
            font-family: 'Minecraft', sans-serif;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .ks-nav-item:hover .ks-nav-inner {
            background: rgba(128, 128, 128, 0.1);
            color: var(--st-text);
        }

        .ks-nav-item.active .ks-nav-inner {
            background: var(--st-btn-sec-hover);
            color: var(--st-text);
            border-color: var(--st-border);
            letter-spacing: 2px;
        }

        /* КОНТЕЙНЕР */
        .ks-content {
            background: var(--st-card-bg);
            border: 1px solid var(--st-border);
            border-radius: 10px 40px 40px 40px;
            padding: 40px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            width: 670px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            transition: height 0.2s cubic-bezier(0.2, 0, 0, 1);
        }

        .ks-tab-panel {
            display: none;
            opacity: 0;
            transition: opacity 0.15s ease-in-out;
        }

        .ks-tab-panel h3 {
            margin: 0 0 8px 0;
            font-size: 1rem;
            color: var(--st-text);
            font-family: 'Minecraft', sans-serif;
            font-weight: normal;
        }

        .ks-tab-panel p {
            margin: 0 0 14px 0;
            font-size: 0.85rem;
            color: var(--st-text-dim);
        }

        .ks-tab-panel.active {
            display: block;
            opacity: 1;
        }

        .ks-header {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--st-border);
            padding-bottom: 16px;
        }

        .ks-title {
            font-family: 'Minecraft', sans-serif, monospace;
            font-size: 1.4rem;
            color: var(--st-text);
            margin: 0 0 6px 0;
        }

        .ks-subtitle {
            color: var(--st-text-dim);
            font-size: 0.85rem;
            margin: 0;
        }

        .ks-user-box {
            background: var(--st-user-bg);
            border: 1px solid var(--st-user-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .ks-user-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ks-username {
            font-family: 'Minecraft', sans-serif, monospace;
            font-size: 1.2rem;
            color: var(--st-text);
        }

        .ks-uuid {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--st-text-dim);
            user-select: all;
        }

        .ks-table-container {
            border: 1px solid var(--st-border);
            border-radius: 20px;
            background: var(--st-table-bg);
            margin-top: 16px;
        }

        .ks-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
        }

        .ks-table th {
            color: var(--st-text-dim);
            font-weight: 600;
            padding: 10px;
            border-bottom: 3px solid var(--st-border);
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
        }

        .ks-table td {
            padding: 12px 10px;
            border-top: 1px solid var(--st-table-border);
            color: var(--st-text);
        }

        .ks-btn {
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .ks-btn-sec {
            background: var(--st-btn-sec-bg);
            color: var(--st-btn-sec-color);
            border-color: var(--st-border);
            font-family: 'Minecraft', sans-serif;
            font-weight: bold;
        }
        .ks-btn-sec:hover {
            background: var(--st-btn-sec-hover);
            color: var(--st-text);
        }

        .ks-btn-danger {
            background: rgba(255, 85, 85, 0.1);
            color: #ff5555;
            border-color: rgba(255, 85, 85, 0.3);
            font-family: 'Minecraft', sans-serif;
            font-weight: normal;
        }
        .ks-btn-danger:hover {
            background: #ff5555;
            color: #fff;
        }

        /* Модальное окно */
        .ks-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .ks-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .ks-modal {
            background: var(--st-modal-bg);
            border: 1px solid var(--st-modal-border);
            border-radius: 20px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transform: translate3d(0, 30px, 0) scale(0.9);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .ks-modal-overlay.active .ks-modal {
            transform: translate3d(0, 0, 0) scale(1);
        }

        .ks-modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--st-text);
            margin: 0 0 10px 0;
            font-family: 'Minecraft', sans-serif;
        }

        .ks-modal-desc {
            font-size: 0.85rem;
            color: var(--st-text-dim);
            margin: 0 0 20px 0;
            line-height: 1.4;
        }

        .ks-modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* Остальные стили (спойлеры, кнопки подсказок и т.д.) */
        .info-btn {
            position: relative !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 1.2em !important;
            vertical-align: middle !important;
            font-family: 'Minecraft', sans-serif !important;
        }
        .info-btn:hover { color: var(--accent); }
        .info-btn .tooltip {
            position: absolute;
            bottom: 135%;
            left: 50%;
            transform: translateX(-50%) translateY(10px) scale(0.9);
            width: 220px;
            padding: 10px;
            background-color: var(--st-modal-bg);
            color: var(--st-text);
            text-align: center;
            font-size: 11px;
            font-family: 'Montserrat';
            border-radius: 10px;
            visibility: hidden;
            opacity: 0;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .info-btn:hover .tooltip {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .ks-spoiler {
            position: relative;
            display: inline-block;
            cursor: pointer;
            user-select: none;
            overflow: hidden;
            vertical-align: bottom;
            --mask-x: 50%;
            --mask-y: 50%;
        }
        .ks-spoiler-content {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s linear, visibility 0.2s linear;
        }
        .ks-spoiler.revealed .ks-spoiler-content {
            visibility: visible;
            opacity: 1;
            user-select: auto;
        }
        .ks-spoiler-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        .ks-ip-toggle-btn {
            background: rgba(128, 128, 128, 0.1);
            border: 1px solid var(--st-border);
            color: var(--st-text-dim);
            font-size: 0.65rem;
            padding: 2px 4px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Minecraft', sans-serif;
        }
        .ks-ip-toggle-btn:hover {
            background: rgba(128, 128, 128, 0.2);
            color: var(--st-text);
        }

        @media (max-width: 960px) {
            .settings-grid { gap: 10px; grid-template-columns: 1fr; }
            .ks-sidebar { width: 100%; border-radius: 40px 40px 20px 20px; }
            .ks-sidebar::after { display: none; }
            .ks-content { padding: 20px; width: 100%; border-radius: 20px 20px 40px 40px; }
            .page-container { padding: 0 10px; }
        }
    </style>
</head>
<body>
    <!-- (Остальная разметка HTML и скрипты страницы настроек остаются без изменений) -->
</body>
</html>
