<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Kaeront | Профиль</title>
    <link rel="icon" id="dynamic-favicon" type="image/png" href="https://kaeront.ru/assets/silhouette.png">
    <style>
        :root {
            --nav-hide: 70px;
        }

        .user-container {
            max-width: 1000px;
            margin: 120px auto 60px;
            padding: 0 20px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .profile-layout-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
            justify-content: center;
        }

        .fullbody-avatar-container {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fullbody-avatar {
            max-height: 380px;
            width: auto;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
        }

        .user-card {
            background: rgba(15, 15, 15, 0.8);
            border: 1px solid #1a1a1a;
            border-radius: 40px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            flex-grow: 1;
            max-width: 700px;
        }

        .registered-badge {
            font-family: 'Minecraft', sans-serif;
            color: var(--text-dim);
            font-size: 0.65rem;
            margin-bottom: 15px;
        }

        .user-avatar-wrapper {
            position: relative;
            margin-bottom: 10px;
        }

        .user-avatar {
            width: 128px;
            height: 128px;
            border-radius: 16px;
        }

        /* Стили бэйджей на карточке профиля */
        .user-badges-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .user-badges-container::before {
            content: 'Значки:';
            font-size: 0.7rem;
            color: var(--text-dim);
        }
        
        .badge-item {
            position: relative;
            display: inline-flex;
            align-items: center;
            font-size: 0.75rem;
            color: #ffaa00;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }
        
        .badge-item:hover { transform: scale(1.2); }
        
        .badge-icon {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }
        
        /* Tooltip при наведении */
        .badge-tooltip {
            position: absolute;
            bottom: 150%;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            background: #111111;
            border: 1px solid #333;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            border-radius: 8px;
            padding: 8px 12px;
            width: max-content;
            max-width: 220px;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
            z-index: 1000;
        }
        
        .badge-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 7px;
            border-style: solid;
            border-color: #333 transparent transparent transparent;
        }
        
        .badge-item:hover .badge-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        
        .badge-tooltip-title {
            font-weight: 700;
            color: #ffaa00;
            font-size: 0.8rem;
            margin-bottom: 3px;
            font-family: 'Minecraft', sans-serif;
        }
        
        .badge-tooltip-desc {
            color: #bbb;
            font-size: 0.65rem;
            line-height: 1.3;
            font-family: 'Montserrat', sans-serif;
        }

        .user-name {
            font-family: 'Minecraft', sans-serif;
            font-size: 1.8rem;
            color: var(--text-main);
            margin: 0 0 8px 0;
            font-weight: 700;
        }

        .user-uuid {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 20px;
            user-select: all;
            background: #050505;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #111;
        }

        .status-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dim);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
        }

        .status-dot.online {
            background: #55ff55;
            box-shadow: 0 0 8px rgba(85, 255, 85, 0.5);
        }

        .status-dot.offline {
            background: #ff5555;
        }

        .profile-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #121212;
            border: 1px solid #282828;
            color: var(--text-main, #ececec);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: var(--transition, all 0.2s ease);
            cursor: pointer;
        }

        .link-btn:hover {
            border-color: var(--accent, #ffaa00);
            color: var(--accent, #ffaa00);
            transform: translateY(-2px);
        }

        .error-card {
            color: #ff4444;
            font-family: 'Minecraft', sans-serif;
            font-size: 0.9rem;
        }

        /* Компактные Счётчики и подписки */
        .follow-stats-container {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            justify-content: center;
            align-items: center;
        }
        
        .stat-box {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 6px 14px;
            background: #0a0a0a;
            border: 1px solid #1f1f1f;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            color: var(--text-dim);
        }
        
        .stat-box:hover {
            border-color: #ffaa00;
            transform: translateY(-2px);
        }
        
        .stat-value {
            font-family: 'Minecraft', sans-serif;
            font-size: 0.95rem;
            color: #ffaa00;
        }
        
        /* Кнопка подписки */
        .btn-follow {
            background: #ffaa00 !important;
            color: #000 !important;
            border: 1px solid #ffaa00 !important;
            font-weight: 700 !important;
            font-family: 'Montserrat', sans-serif !important;
        }
        
        .btn-follow.following {
            background: #1a1a1a !important;
            color: #888 !important;
            border-color: #333 !important;
        }
        
        .btn-follow:hover {
            box-shadow: 0 0 12px rgba(255, 170, 0, 0.4);
        }
        
        /* SPA Modal */
        .spa-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
        }
        
        .spa-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .spa-modal-card {
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 16px;
            width: 90%;
            max-width: 440px;
            max-height: 520px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        
        .spa-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #1a1a1a;
            font-family: 'Minecraft', sans-serif;
            color: #ffaa00;
        }
        
        .spa-modal-close {
            cursor: pointer;
            color: #666;
            font-size: 1.2rem;
            transition: color 0.2s;
        }
        .spa-modal-close:hover { color: #fff; }
        
        .spa-modal-body {
            padding: 12px;
            overflow-y: auto;
            flex-grow: 1;
        }
        
        .follow-user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            color: #fff;
            transition: background 0.2s;
        }
        
        .follow-user-item:hover {
            background: #161616;
        }
        
        .follow-user-avatar {
            width: 36px; height: 36px; border-radius: 6px;
        }
        
        .follow-user-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .profile-layout-wrapper {
                flex-direction: column;
            }
            .fullbody-avatar {
                max-height: 260px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loader-wrapper" style="position: fixed; user-select: none; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 99999; transition: opacity 0.5s ease, visibility 0.5s; animation: hideLoaderNoJS 0.5s forwards;">
        <div style="position: relative; text-align: center; width: 100%;">
            <div style="font-family: sans-serif; color: #888; font-size: clamp(3vh, 3vw, 3vw); animation: fadeOutText 0.3s forwards; animation-delay: 5s;">
                <span style="font-family: sans-serif; color: #FFAA00;">Kaeront</span> загружается...
            </div>
            <div style="position: absolute; top: 0; left: 0; right: 0; font-family: sans-serif; color: #888; font-size: clamp(3vh, 3vw, 3vw); opacity: 0; animation: fadeInText 0.3s forwards; animation-delay: 5s; line-height: 0.3;">
                «Что-то вы долго!»<span style="font-size: clamp(1vh, 1vw, 1vw);"><br><br>Попробуйте обновить страницу.<br>Загрузка <span style="font-family: sans-serif; color: #FFAA00;">Kaeront</span> всё ещё идёт.</span>
            </div>
        </div>
    </div>
    
    <script>
        (function() {
            const loader = document.getElementById('loader-wrapper');

                loader.style.animation = 'none';

        @keyframes fadeOutText { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }

    <div class="spa-modal-overlay" id="follow-modal">
        <div class="spa-modal-card">
            <div class="spa-modal-header">
                <span id="modal-title">Подписчики</span>

<script>
document.addEventListener("DOMContentLoaded", () => {
    loadUserProfile();

    // Закрытие модального окна при клике мимо него (по оверлею)
    const modalOverlay = document.getElementById('follow-modal');
    if (modalOverlay) {
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeFollowModal();
            }
        });
    }
});

// Кэш для подписчиков и подписок
const followCache = {};
let currentType = null;
let currentRenderedIndex = 0;
const BATCH_SIZE = 5;

// Получение UUID текущего вошедшего пользователя из JWT
function getCurrentUserUuid() {
    const token = localStorage.getItem('kaeront_access_token');
    if (!token) return null;
    try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const payload = JSON.parse(decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
        return payload.sub ? payload.sub.toLowerCase() : null;
    } catch (e) {
        return null;
    }
}

async function loadUserProfile() {
    const card = document.getElementById('user-card');
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const queryTarget = pathParts[pathParts.length - 1];

    const hideLoader = () => {
        const loader = document.getElementById('loader-wrapper');
        if (loader) {
            loader.style.opacity = '0';
            loader.style.visibility = 'hidden';
            setTimeout(() => { loader.style.display = 'none'; }, 500);
        }
        document.body.style.overflow = 'auto';
    };

    if (!queryTarget || queryTarget === 'user') {
        card.innerHTML = `<div class="error-card">Пользователь не указан</div>`;
        hideLoader();
        return;
    }

    try {
        const playerRes = await fetch(`https://playerdb.co/api/player/minecraft/${encodeURIComponent(queryTarget)}`);
        if (!playerRes.ok) throw new Error("Игрок не найден в базе Minecraft.");
        
        const playerData = await playerRes.json();
        if (!playerData.success || !playerData.data || !playerData.data.player) {
            throw new Error("Игрок с таким ником или UUID не найден.");
        }

        const player = playerData.data.player;
        const username = player.username;
        const uuid = player.id;
        const rawId = player.raw_id;
        updateFavicon(rawId, username);
        const avatarUrl = `https://nmsr.nickac.dev/face/${rawId}`;
        const fullBodyUrl = `https://nmsr.nickac.dev/fullbodyiso/${rawId}`;
        const nameMcUrl = `https://namemc.com/profile/${uuid}`;

        let registeredText = '';
        let isRegistered = false;
        let siteOnline = false;
        let serverOnline = false;
        let isFollowing = false;
        let dbData = null;

        const token = localStorage.getItem('kaeront_access_token');
        const headers = {};
        if (token) {
            headers['Authorization'] = `Bearer ${token}`;
        }

        try {
            const dbRes = await fetch(`/api/users/${uuid}`, { headers });
            if (dbRes.ok) {
                dbData = await dbRes.json();
                if (dbData) {
                    if (dbData.registered_at) {
                        isRegistered = true;
                        const regDate = new Date(dbData.registered_at.includes('Z') ? dbData.registered_at : dbData.registered_at + 'Z'); 
                        const formattedDate = regDate.toLocaleString(undefined, {
                            year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                        });
                        registeredText = `<div class="registered-badge">Зарегистрирован на kaeront.ru с ${formattedDate}</div>`;
                    }
                    siteOnline = dbData.site_online ?? false;
                    serverOnline = dbData.server_online ?? false;
                    isFollowing = dbData.is_following ?? false;
                }
            }
        } catch (e) {
            console.warn("Игрок не зарегистрирован на Kaeront или API недоступно:", e);
        }

        // Рендеринг значков
        let badgesHTML = '';
        if (dbData && dbData.badges && dbData.badges.length > 0) {
            badgesHTML = `<div class="user-badges-container">` + 
                dbData.badges.map(b => {
                    const imgSrc = b.image_base64 ? b.image_base64 : '/assets/unavailable.png';
                    return `
                    <div class="badge-item">
                        <img src="${imgSrc}" class="badge-icon" alt="${b.name}">
                        <div class="badge-tooltip">
                            <div class="badge-tooltip-title">${b.name}</div>
                            <div class="badge-tooltip-desc">${b.description}</div>
                        </div>
                    </div>`;
                }).join('') + 
            `</div>`;
        }

        // Статус "На сайте"
        const siteStatusHTML = isRegistered ? `
            <div class="status-badge">
                <span class="status-dot ${siteOnline ? 'online' : 'offline'}"></span>
                На сайте: <b>${siteOnline ? 'Онлайн' : 'Оффлайн'}</b>
            </div>
        ` : '';

        const followersCount = dbData ? dbData.followers_count : 0;
        const followingCount = dbData ? dbData.following_count : 0;
        
        // Проверка: мы на собственной странице или нет
        const currentUserUuid = getCurrentUserUuid();
        const isOwnProfile = currentUserUuid && currentUserUuid === uuid.toLowerCase();

        // Формируем кнопку подписки ТОЛЬКО если мы не на своем профиле и пользователь вошел
        let followButtonHTML = '';
        if (token && !isOwnProfile) {
            const btnClass = isFollowing ? 'link-btn btn-follow following' : 'link-btn btn-follow';
            const btnText = isFollowing ? 'Вы подписаны' : 'Подписаться';
            followButtonHTML = `
                <button id="btn-follow" class="${btnClass}" onclick="toggleFollow('${uuid}')">
                    ${btnText}
                </button>
            `;
        }

        card.innerHTML = `
            ${registeredText}
            <div class="profile-layout-wrapper">
                <div class="fullbody-avatar-container">
                    <img src="${fullBodyUrl}" alt="${username}" class="fullbody-avatar">
                </div>
                <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                    <div class="user-avatar-wrapper">
                        <img src="${avatarUrl}" alt="${username}" class="user-avatar">
                    </div>
                    <h1 class="user-name">${username}</h1>
                    <div class="user-uuid">${uuid}</div>

                    <!-- Статусы -->
                    <div class="status-container">
                        ${siteStatusHTML}
                        <div class="status-badge">
                            <span class="status-dot ${serverOnline ? 'online' : 'offline'}"></span>
                            В игре на Kaeront: <b>${serverOnline ? 'Онлайн' : 'Оффлайн'}</b>
                        </div>
                    </div>

                    <!-- Значки -->
                    ${badgesHTML}
                    
                    <!-- Компактные счетчики -->
                    <div class="follow-stats-container">
                        <div class="stat-box" onclick="openFollowModal('${uuid}', 'followers')">
                            <span class="stat-value">${followersCount}</span> Подписчиков
                        </div>
                        <div class="stat-box" onclick="openFollowModal('${uuid}', 'following')">
                            <span class="stat-value">${followingCount}</span> Подписки
                        </div>
                    </div>

                    <div class="profile-actions" id="profile-actions">
                        ${followButtonHTML}
                        <a href="${nameMcUrl}" target="_blank" rel="noopener noreferrer" class="link-btn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                            NameMC
                        </a>
                    </div>
                </div>
            </div>
        `;

        renderSettingsButton(uuid);

    } catch (err) {
        card.innerHTML = `<div class="error-card">${err.message}</div>`;
    } finally {
        hideLoader();
    }
}

function renderSettingsButton(profileUuid) {
    const currentUserUuid = getCurrentUserUuid();
    if (currentUserUuid && currentUserUuid === profileUuid.toLowerCase()) {
        const actionsContainer = document.getElementById('profile-actions');

        if (actionsContainer && !document.getElementById('btn-to-settings')) {
            const settingsBtn = document.createElement('a');
            settingsBtn.id = 'btn-to-settings';
            settingsBtn.href = '/settings';
            settingsBtn.className = 'link-btn';
            settingsBtn.innerHTML = `

}

async function updateFavicon(rawId, username) {
    const favicon = document.getElementById('dynamic-favicon');
    if (!favicon) return;

    const avatarUrl = `https://nmsr.nickac.dev/face/${rawId}`;

    const loadImage = (url) => new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
    });

    try {
        const avatarImg = await loadImage(avatarUrl);
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');

        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = '#fa0';
        ctx.fillRect(0, 0, 64, 64);
        ctx.drawImage(avatarImg, 4, 4, 56, 56);
        ctx.strokeStyle = '#fa0';
        ctx.lineWidth = 4;
        ctx.strokeRect(2, 2, 60, 60);

        favicon.href = canvas.toDataURL('image/png');
    } catch (e) {
        favicon.href = '/assets/silhouette.png';
    }
}

function renderNextChunk() {
    if (!currentType || !followCache[currentType]) return;

    const listBody = document.getElementById('modal-list-body');
    const items = followCache[currentType];
    const nextChunk = items.slice(currentRenderedIndex, currentRenderedIndex + BATCH_SIZE);

    if (nextChunk.length === 0) return;

    const html = nextChunk.map(item => `
        <a href="/user/${item.username}" class="follow-user-item">
            <img src="https://nmsr.nickac.dev/face/${item.uuid.replace(/-/g,'')}" class="follow-user-avatar">
            <span class="follow-user-name">${item.username}</span>
        </a>
    `).join('');

    listBody.insertAdjacentHTML('beforeend', html);
    currentRenderedIndex += nextChunk.length;
}

async function openFollowModal(targetUuid, type) {
    const modal = document.getElementById('follow-modal');
    const title = document.getElementById('modal-title');
    const listBody = document.getElementById('modal-list-body');

    title.innerText = type === 'followers' ? 'Подписчики' : 'Подписки';
    listBody.innerHTML = '';
    modal.classList.add('active');

    currentType = `${targetUuid}_${type}`;
    currentRenderedIndex = 0;
    listBody.onscroll = null;

    if (followCache[currentType]) {
        if (followCache[currentType].length === 0) {
            listBody.innerHTML = '<div style="text-align:center; padding:20px; color:#555;">Список пуст</div>';
            return;
        }
        renderNextChunk();
        attachModalScroll(listBody);
        return;
    }

    listBody.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">Загрузка...</div>';

    try {
        const res = await fetch(`/api/users/${targetUuid}?subpath=${type}`);
        const data = await res.json();
        const items = data[type] || [];

        followCache[currentType] = items;
        listBody.innerHTML = '';

        if (items.length === 0) {
            listBody.innerHTML = '<div style="text-align:center; padding:20px; color:#555;">Список пуст</div>';
            return;
        }

        renderNextChunk();
        attachModalScroll(listBody);

    } catch (e) {
        listBody.innerHTML = '<div style="text-align:center; color:#ff5555; padding:20px;">Ошибка загрузки</div>';
    }
}

function attachModalScroll(container) {
    container.onscroll = () => {
        if (container.scrollTop + container.clientHeight >= container.scrollHeight - 20) {
            renderNextChunk();
        }
    };
}

function closeFollowModal() {
    document.getElementById('follow-modal').classList.remove('active');
}

async function toggleFollow(targetUuid) {
    const token = localStorage.getItem('kaeront_access_token');
    if (!token) return;

    const btn = document.getElementById('btn-follow');
    if (!btn) return;

    const isFollowing = btn.classList.contains('following');
    const endpoint = isFollowing ? '/api/v1/users/unfollow' : '/api/v1/users/follow';

    try {
        const res = await fetch(endpoint, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ target_uuid: targetUuid })
        });

        if (res.ok) {
            btn.classList.toggle('following');
            btn.innerText = btn.classList.contains('following') ? 'Вы подписаны' : 'Подписаться';
        } else {
            const rawText = await res.text();
            console.error('Ошибка подписки (статус ' + res.status + '):', rawText);
        }
    } catch (e) {
        console.error('Follow Error:', e);
    }
}
