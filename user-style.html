<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Kaeront | Профиль</title>
    <link rel="icon" id="dynamic-favicon" type="image/png" href="https://kaeront.ru/assets/silhouette.png">
    <style>
        :root {
            --nav-hide: 70px;
        }

        .user-container {
            max-width: 1000px;
            margin: 120px auto 60px;
            padding: 0 20px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .profile-layout-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
            justify-content: center;
        }

        .fullbody-avatar-container {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fullbody-avatar {
            max-height: 380px;
            width: auto;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
        }

        .user-card {
            background: rgba(15, 15, 15, 0.8);
            border: 1px solid #1a1a1a;
            border-radius: 40px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            flex-grow: 1;
            max-width: 700px;
        }

        .registered-badge {
            font-family: 'Minecraft', sans-serif;
            color: var(--text-dim);
            font-size: 0.65rem;
            margin-bottom: 15px;
        }

        .user-avatar-wrapper {
            position: relative;
            margin-bottom: 10px;
        }

        .user-avatar {
            width: 128px;
            height: 128px;
            border-radius: 16px;
        }

        /* Стили бэйджей на карточке профиля */
        .user-badges-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .badge-item {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 170, 0, 0.1);
            border: 1px solid rgba(255, 170, 0, 0.3);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: #ffaa00;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }
        
        .badge-item:hover {
            transform: translateY(-2px);
            border-color: #ffaa00;
            background: rgba(255, 170, 0, 0.18);
        }
        
        .badge-icon {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }
        
        /* Tooltip при наведении */
        .badge-tooltip {
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            background: #111111;
            border: 1px solid #333;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            border-radius: 8px;
            padding: 8px 12px;
            width: max-content;
            max-width: 220px;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
            z-index: 1000;
        }
        
        .badge-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: #333 transparent transparent transparent;
        }
        
        .badge-item:hover .badge-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        
        .badge-tooltip-title {
            font-weight: 700;
            color: #ffaa00;
            font-size: 0.75rem;
            margin-bottom: 3px;
            font-family: 'Montserrat', sans-serif;
        }
        
        .badge-tooltip-desc {
            color: #bbb;
            font-size: 0.68rem;
            line-height: 1.3;
            font-family: sans-serif;
        }

        .user-name {
            font-family: 'Minecraft', sans-serif;
            font-size: 1.8rem;
            color: var(--text-main);
            margin: 0 0 8px 0;
            font-weight: 700;
        }

        .user-uuid {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 15px;
            user-select: all;
            background: #050505;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #111;
        }

        .status-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dim);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
        }

        .status-dot.online {
            background: #55ff55;
            box-shadow: 0 0 8px rgba(85, 255, 85, 0.5);
        }

        .status-dot.offline {
            background: #ff5555;
        }

        .profile-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #121212;
            border: 1px solid #282828;
            color: var(--text-main, #ececec);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: var(--transition, all 0.2s ease);
        }

        .link-btn:hover {
            border-color: var(--accent, #ffaa00);
            color: var(--accent, #ffaa00);
            transform: translateY(-2px);
        }

        .error-card {
            color: #ff4444;
            font-family: 'Minecraft', sans-serif;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .profile-layout-wrapper {
                flex-direction: column;
            }
            .fullbody-avatar {
                max-height: 260px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loader-wrapper" style="position: fixed; user-select: none; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 99999; transition: opacity 0.5s ease, visibility 0.5s; animation: hideLoaderNoJS 0.5s forwards;">
        <div style="position: relative; text-align: center; width: 100%;">
            <!-- Основной текст (исчезает через 5 секунд) -->
            <div style="font-family: sans-serif; color: #888; font-size: clamp(3vh, 3vw, 3vw); animation: fadeOutText 0.3s forwards; animation-delay: 5s;">
                <span style="font-family: sans-serif; color: #FFAA00;">Kaeront</span> загружается...
            </div>
            <!-- Текст ошибки -->
            <div style="position: absolute; top: 0; left: 0; right: 0; font-family: sans-serif; color: #888; font-size: clamp(3vh, 3vw, 3vw); opacity: 0; animation: fadeInText 0.3s forwards; animation-delay: 5s; line-height: 0.3;">
                «Что-то вы долго!»<span style="font-size: clamp(1vh, 1vw, 1vw);"><br><br>Попробуйте обновить страницу.<br>Загрузка <span style="font-family: sans-serif; color: #FFAA00;">Kaeront</span> всё ещё идёт.</span>
            </div>
        </div>
    </div>
    
    <script>
        // Мгновенная блокировка авто-скрытия, если JS разрешен
        (function() {
            const loader = document.getElementById('loader-wrapper');
            if (loader) {
                // Удаляем анимацию hideLoaderNoJS, чтобы лоадер не исчез сам по себе
                loader.style.animation = 'none';
            }
        })();
    </script>
    
    <style>
        /* Блокировка скролла по умолчанию */
        body { overflow: hidden; }
        /* Анимация для случая, когда JavaScript отключен */
        @keyframes hideLoaderNoJS { to { opacity: 0; visibility: hidden; } }
        @keyframes fadeOutText { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
        @keyframes fadeInText { from { opacity: 0; } to { opacity: 1; } }
    </style>
    <noscript>
    <div style=" position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0a0a0a; color: white; user-select: none; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-family: sans-serif; box-sizing: border-box; overflow: hidden;">
        <h2 style="max-width: 80vw; font-family: sans-serif; color: #FA0; font-size: clamp(3vh, 3vw, 3vw); font-weight: 600;">Включите JavaScript</h2>
        <p style="max-width: 80vw; font-size: clamp(1.5vh, 1.2vw, 1.2vw); line-height: 1.6; color: #888; ">Для корректной работы сайта kaeront.ru, стабильного отображения контента, анимаций и переходов необходимо включить поддержку JavaScript на вашем браузере. Без него большинство функций будет недоступно. Данное предупреждение скрыть невозможно, из-за не работы скриптов, как раз таки.<br>¯\_(ツ)_/¯</p>
    </div>
    
    <style>
        body { overflow: hidden !important; }
    </style>
    </noscript>

    <div id="dev-inject"></div>
    <div id="nav-inject"></div>

    <main class="user-container">
        <div class="user-card" id="user-card">
            <div style="color: var(--text-dim); font-size: 0.8rem;">Загрузка профиля...</div>
        </div>
    </main>

    <div id="footer-inject"></div>

    <script src="/assets/global.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    loadUserProfile();
});

async function loadUserProfile() {
    const card = document.getElementById('user-card');
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const queryTarget = pathParts[pathParts.length - 1];

    const hideLoader = () => {
        const loader = document.getElementById('loader-wrapper');
        if (loader) {
            loader.style.opacity = '0';
            loader.style.visibility = 'hidden';
            setTimeout(() => { loader.style.display = 'none'; }, 500);
        }
        document.body.style.overflow = 'auto';
    };

    if (!queryTarget || queryTarget === 'user') {
        card.innerHTML = `<div class="error-card">Пользователь не указан</div>`;
        hideLoader();
        return;
    }

    try {
        const playerRes = await fetch(`https://playerdb.co/api/player/minecraft/${encodeURIComponent(queryTarget)}`);
        if (!playerRes.ok) throw new Error("Игрок не найден в базе Minecraft.");
        
        const playerData = await playerRes.json();
        if (!playerData.success || !playerData.data || !playerData.data.player) {
            throw new Error("Игрок с таким ником или UUID не найден.");
        }

        const player = playerData.data.player;
        const username = player.username;
        const uuid = player.id;
        const rawId = player.raw_id;
        updateFavicon(rawId, username);
        const avatarUrl = `https://nmsr.nickac.dev/face/${rawId}`;
        const fullBodyUrl = `https://nmsr.nickac.dev/fullbodyiso/${rawId}`;
        const nameMcUrl = `https://namemc.com/profile/${uuid}`;

        let registeredText = '';
        let isRegistered = false;
        let siteOnline = false;
        let serverOnline = false;
        let dbData = null; // Выносим переменную на уровень выше, чтобы устранить ReferenceError

        // Безопасное получение данных с Kaeront API
        try {
            const dbRes = await fetch(`/api/users/${uuid}`);
            if (dbRes.ok) {
                dbData = await dbRes.json();
                if (dbData) {
                    if (dbData.registered_at) {
                        isRegistered = true;
                        const regDate = new Date(dbData.registered_at.includes('Z') ? dbData.registered_at : dbData.registered_at + 'Z'); 
                        const formattedDate = regDate.toLocaleString(undefined, {
                            year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                        });
                        registeredText = `<div class="registered-badge">Зарегистрирован на kaeront.ru с ${formattedDate}</div>`;
                    }
                    siteOnline = dbData.site_online ?? false;
                    serverOnline = dbData.server_online ?? false;
                }
            }
        } catch (e) {
            console.warn("Игрок не зарегистрирован на Kaeront или API недоступно:", e);
        }

        // Рендеринг значков с тултипом
        let badgesHTML = '';
        if (dbData && dbData.badges && dbData.badges.length > 0) {
            badgesHTML = `<div class="user-badges-container">` + 
                dbData.badges.map(b => {
                    const imgSrc = b.image_base64 ? b.image_base64 : '/assets/silhouette.png';
                    return `
                    <div class="badge-item">
                        <img src="${imgSrc}" class="badge-icon" alt="${b.name}">
                        <span>${b.name}</span>
                        <div class="badge-tooltip">
                            <div class="badge-tooltip-title">${b.name}</div>
                            <div class="badge-tooltip-desc">${b.description}</div>
                        </div>
                    </div>`;
                }).join('') + 
            `</div>`;
        }

        // Статус "На сайте" только для зарегистрированных пользователей
        const siteStatusHTML = isRegistered ? `
            <div class="status-badge">
                <span class="status-dot ${siteOnline ? 'online' : 'offline'}"></span>
                На сайте: <b>${siteOnline ? 'Онлайн' : 'Оффлайн'}</b>
            </div>
        ` : '';

        card.innerHTML = `
            ${registeredText}
            <div class="profile-layout-wrapper">
                <div class="fullbody-avatar-container">
                    <img src="${fullBodyUrl}" alt="${username}" class="fullbody-avatar">
                </div>
                <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                    <div class="user-avatar-wrapper">
                        <img src="${avatarUrl}" alt="${username}" class="user-avatar">
                    </div>
                    <h1 class="user-name">${username}</h1>
                    <div class="user-uuid">${uuid}</div>
                    ${badgesHTML}
                    <div class="status-container">
                        ${siteStatusHTML}
                        <div class="status-badge">
                            <span class="status-dot ${serverOnline ? 'online' : 'offline'}"></span>
                            В игре на Kaeront: <b>${serverOnline ? 'Онлайн' : 'Оффлайн'}</b>
                        </div>
                    </div>
                    <div class="profile-actions" id="profile-actions">
                        <a href="${nameMcUrl}" target="_blank" rel="noopener noreferrer" class="link-btn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                            Посмотреть на NameMC
                        </a>
                    </div>
                </div>
            </div>
        `;

        renderSettingsButton(uuid);

    } catch (err) {
        card.innerHTML = `<div class="error-card">${err.message}</div>`;
    } finally {
        hideLoader();
    }
}

function renderSettingsButton(profileUuid) {
    const token = localStorage.getItem('kaeront_access_token');
    if (!token) return;

    try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const payload = JSON.parse(decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));

        if (payload.sub && payload.sub.toLowerCase() === profileUuid.toLowerCase()) {
            const actionsContainer = document.getElementById('profile-actions');

            if (actionsContainer && !document.getElementById('btn-to-settings')) {
                const settingsBtn = document.createElement('a');
                settingsBtn.id = 'btn-to-settings';
                settingsBtn.href = '/settings';
                settingsBtn.className = 'link-btn';
                settingsBtn.innerHTML = `
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    Настройки
                `;
                actionsContainer.appendChild(settingsBtn);
            }
        }
    } catch (e) {
        console.error("Ошибка проверки владельца профиля:", e);
    }
}

async function updateFavicon(rawId, username) {
    const favicon = document.getElementById('dynamic-favicon');
    if (!favicon) return;

    const avatarUrl = `https://nmsr.nickac.dev/face/${rawId}`;

    const loadImage = (url) => new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
    });

    try {
        const avatarImg = await loadImage(avatarUrl);
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');

        ctx.imageSmoothingEnabled = false;

        ctx.fillStyle = '#fa0';
        ctx.fillRect(0, 0, 64, 64);

        ctx.drawImage(avatarImg, 4, 4, 56, 56);

        ctx.strokeStyle = '#fa0';
        ctx.lineWidth = 4;
        ctx.strokeRect(2, 2, 60, 60);

        favicon.href = canvas.toDataURL('image/png');
    } catch (e) {
        favicon.href = '/assets/silhouette.png';
    }
}
</script>
</body>
</html>
