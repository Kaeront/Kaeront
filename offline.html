<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="/assets/unavailable_favicon.png">
    <title>Kaeront | Оффлайн</title>
    <script src="/assets/global.js" defer></script>

    <style>
        :root {
            --nav-hide: 100vh;
        }

        .error-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            text-align: left;
            margin: auto;
            justify-content: center;
            padding: 20px;
            overflow-wrap: anywhere;
            max-width: 600px;
        }
        .error-wrapper img { user-select: none; image-rendering: pixelated; image-rendering: crisp-edges; width: 3em; filter: drop-shadow(5px 5px 0 #3E2A00); }
        .error-wrapper h1 { font-family: 'Minecraft'; color: var(--accent); font-size: 2rem; font-weight: 400; line-height: 1.1; margin: 7px 0; text-shadow: 0.11em 0.11em #3E2A00; z-index: 0; }
        #error-msg { color: var(--text-dim); font-size: 1rem; margin: 0; }
    </style>
</head>
<body>
  <!-- Loading Screen -->
<div id="loader-wrapper" style="
    position: fixed;
    user-select: none;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    transition: opacity 0.5s ease, visibility 0.5s;
    animation: hideLoaderNoJS 0.5s forwards;
    animation-delay: 0.25s;
">
    <div style="position: relative; text-align: center; width: 100%;">

        <!-- Основной текст (исчезает через 5 секунд) -->
        <div style="
            font-family: sans-serif;
            color: #888;
            font-size: clamp(3vh, 3vw, 3vw);
            animation: fadeOutText 0.3s forwards;
            animation-delay: 5s;
        ">
            <span style="font-family: sans-serif; color: #FFAA00;">Kaeront</span> загружается...
        </div>

        <!-- Текст ошибки -->
        <div style="
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            font-family: sans-serif;
            color: #888;
            font-size: clamp(3vh, 3vw, 3vw);
            opacity: 0;
            animation: fadeInText 0.3s forwards;
            animation-delay: 5s;
            line-height: 0.7;
        ">
            «Что-то вы долго!»<span style="font-size: clamp(1vh, 1vw, 1vw);"><br>Попробуйте обновить страницу.<br>Загрузка всё ещё идёт.</span>
        </div>

    </div>
</div>

<script>
    // Мгновенная блокировка авто-скрытия, если JS разрешен
    (function() {
        const loader = document.getElementById('loader-wrapper');
        if (loader) {
            // Удаляем анимацию hideLoaderNoJS, чтобы лоадер не исчез сам по себе
            loader.style.animation = 'none';
        }
    })();
</script>

<style>
    /* Блокировка скролла по умолчанию */
    body { 
        overflow: hidden;
    }

    /* Анимация для случая, когда JavaScript отключен */
    @keyframes hideLoaderNoJS {
        to { 
            opacity: 0; 
            visibility: hidden; 
        }
    }

    @keyframes fadeOutText {
        from { opacity: 1; }
        to { opacity: 0; visibility: hidden; }
    }

    @keyframes fadeInText {
        from { opacity: 0; }
        to { opacity: 1; }
    }
</style>


    <div id="dev-inject"></div>
    <div id="nav-inject"></div>
    <div class="error-wrapper">
        <img src="https://kaeront.ru/assets/unavailable.png" alt="">
        <h1>Оборвано соединение</h1>
        <p id="error-msg">Вы находитесь в оффлайн-режиме. Проверьте подключение к интернету.</p>
    </div>
    <div id="footer-inject"></div>

</body>
</html>
