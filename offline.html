<!DOCTYPE html>
<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="/assets/unavailable_favicon.png">
    <title>Kaeront | Нет подключения</title>
    <script src="/assets/global.js" defer></script>

    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; display: flex; height: 100vh; align-items: center; justify-content: center; margin: 0; }

        .error-wrapper img { image-rendering: pixelated; width: 3em; filter: drop-shadow(5px 5px 0 #3E2A00); }
        h1 { font-family: 'Minecraft', sans-serif; color: #FFAA00; font-size: 2rem; margin: 10px 0; text-shadow: 0.11em 0.11em #3E2A00; }
        p { color: #888; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="error-wrapper">
        <img src="/assets/unavailable.png" alt="Offline">
        <h1>Оборвано соединение</h1>
        <p>Вы находитесь в оффлайн-режиме. Проверьте подключение к интернету.</p>
    </div>

</html>
