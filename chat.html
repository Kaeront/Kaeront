<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaeront | Чат</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --accent: #FFAA00; --bg: #0e0e10; --sidebar-bg: #18181b; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; }

        /* Раздельные scrollable контейнеры */
        #sidebar { width: 260px; background: var(--sidebar-bg); display: flex; flex-direction: column; border-right: 1px solid #27272a; height: 100vh; }
        #chat-main { flex: 1; display: flex; flex-direction: column; height: 100vh; }

        .sidebar-header { padding: 15px; border-bottom: 1px solid #27272a; display: flex; justify-content: space-between; align-items: center; }
        .channels-scroll { flex: 1; overflow-y: auto; padding: 10px; }
        
        .section-title { font-size: 0.75rem; text-transform: uppercase; color: #71717a; margin: 15px 5px 5px 5px; font-weight: bold; }
        .channel-btn { width: 100%; padding: 10px; border-radius: 6px; background: transparent; color: #a1a1aa; border: none; text-align: left; cursor: pointer; font-size: 0.9rem; margin-bottom: 2px; }
        .channel-btn:hover, .channel-btn.active { background: #27272a; color: #fff; }
        .channel-btn.global { font-weight: bold; color: var(--accent); }

        .messages-scroll { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .notice-banner { background: #18181b; border: 1px solid #27272a; color: #71717a; padding: 10px; border-radius: 6px; text-align: center; font-size: 0.8rem; margin-bottom: 10px; }

        .msg { background: #18181b; padding: 10px 14px; border-radius: 8px; max-width: 80%; width: fit-content; }
        .msg-author { font-size: 0.8rem; font-weight: bold; color: var(--accent); margin-bottom: 4px; display: flex; gap: 8px; }
        .msg-source { font-size: 0.65rem; color: #71717a; font-weight: normal; }
        .msg-content { font-size: 0.9rem; color: #e4e4e7; line-height: 1.4; }

        .chat-input-area { padding: 15px; background: #18181b; border-top: 1px solid #27272a; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; background: #09090b; border: 1px solid #27272a; padding: 12px; border-radius: 6px; color: #fff; outline: none; }
        .btn { background: var(--accent); color: #000; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- CONTAINER 1: Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h4>💬 Каналы Kaeront</h4>
            <button onclick="createChannelPrompt()" style="background:none; border:none; color:var(--accent); cursor:pointer;">+</button>
        </div>
        <div class="channels-scroll">
            <div id="active-channels"></div>
            <div class="section-title">— Старые каналы —</div>
            <div id="old-channels"></div>
        </div>
    </div>

    <!-- CONTAINER 2: Main Chat -->
    <div id="chat-main">
        <div class="messages-scroll" id="msg-container">
            <div class="notice-banner">
                Отображены последние 100 сообщений, но мы будем увеличивать лимит со временем.
            </div>
            <div id="messages-list"></div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="Написать сообщение (Интервал 2 сек)..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button class="btn" onclick="sendMsg()">Отправить</button>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('kaeront_access_token');
        let currentChannel = 'global';

        async function api(path, method = 'GET', body = null) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            const res = await fetch(`/api/chat?path=${path}`, { method, headers, body: body ? JSON.stringify(body) : null });
            return res.json();
        }

        async function loadChannels() {
            const data = await api('channels');
            if(!data.channels) return;

            const activeDiv = document.getElementById('active-channels');
            const oldDiv = document.getElementById('old-channels');
            activeDiv.innerHTML = ''; oldDiv.innerHTML = '';

            const oneDayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);

            data.channels.forEach(ch => {
                const btn = document.createElement('button');
                btn.className = `channel-btn ${ch.id === 'global' ? 'global' : ''} ${ch.id === currentChannel ? 'active' : ''}`;
                btn.innerText = `# ${ch.name}`;
                btn.onclick = () => switchChannel(ch.id);

                const lastAct = ch.last_activity ? new Date(ch.last_activity) : new Date(ch.created_at);
                if (lastAct < oneDayAgo && ch.id !== 'global') {
                    oldDiv.appendChild(btn);
                } else {
                    activeDiv.appendChild(btn);
                }
            });
        }

        async function switchChannel(id) {
            currentChannel = id;
            await loadChannels();
            await loadMessages();
        }

        async function loadMessages() {
            const data = await api(`channels/${currentChannel}/messages`);
            const list = document.getElementById('messages-list');
            if (!data.messages) return;

            list.innerHTML = data.messages.map(m => `
                <div class="msg">
                    <div class="msg-author">
                        ${escapeHtml(m.author_name)}
                        <span class="msg-source">• ${m.source === 'game' ? 'из игры' : 'с сайта'}</span>
                    </div>
                    <div class="msg-content">${escapeHtml(m.content)}</div>
                </div>
            `).join('');

            // Автоскролл в самый низ при загрузке новых сообщений
            const container = document.getElementById('msg-container');
            container.scrollTop = container.scrollHeight;
        }

        async function sendMsg() {
            const input = document.getElementById('msg-input');
            const content = input.value.trim();
            if (!content) return;

            const res = await api(`channels/${currentChannel}/messages`, 'POST', { content, source: 'site' });
            if (res.detail) return alert(res.detail);
            
            input.value = '';
            await loadMessages();
        }

        async function createChannelPrompt() {
            const id = prompt("Введите ID нового канала (только буквы, цифры, _ и -):");
            if (!id) return;

            const res = await api('channels', 'POST', { id });
            if (res.detail) return alert(res.detail);
            switchChannel(res.channel_id);
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
        }

        // Поллинг обновлений каждые 3 секунды
        setInterval(loadMessages, 3000);
        
        // Старт
        loadChannels();
        loadMessages();

        // 1. Извлечение имени канала из URL (например, из /pvp_chat берется pvp_chat)
        function getChannelFromUrl() {
            const path = window.location.pathname.replace(/^\/+|\/+$/g, ''); // убираем слэши
            return path ? decodeURIComponent(path).toLowerCase() : 'global';
        }
        
        // 2. Переключение канала с обновлением URL
        async function switchChannel(id, pushHistory = true) {
            currentChannel = id;
        
            // Меняем адресную строку без перезагрузки
            if (pushHistory && window.location.pathname !== `/${id}`) {
                const newPath = id === 'global' ? '/' : `/${id}`;
                history.pushState({ channel: id }, '', newPath);
            }
        
            await loadChannels();
            await loadMessages();
        }
        
        // 3. Обработка кнопок Назад/Вперед в браузере
        window.addEventListener('popstate', (e) => {
            const channelFromState = e.state ? e.state.channel : getChannelFromUrl();
            switchChannel(channelFromState, false);
        });
        
        // 4. Инициализация при старте страницы
        window.addEventListener('DOMContentLoaded', () => {
            const initialChannel = getChannelFromUrl();
            switchChannel(initialChannel, false);
        });
    </script>
</body>
</html>
