<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaeront | Чат</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --accent: #FFAA00; --bg: #0e0e10; --sidebar-bg: #18181b; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', system-ui, -apple-system, sans-serif; height: 100vh; overflow: hidden; display: flex; }

        /* Раздельные scrollable контейнеры */
        #sidebar { width: 260px; background: var(--sidebar-bg); display: flex; flex-direction: column; border-right: 1px solid #27272a; height: 100vh; }
        #chat-main { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }

        .sidebar-header { padding: 15px; border-bottom: 1px solid #27272a; display: flex; justify-content: space-between; align-items: center; }
        .channels-scroll { flex: 1; overflow-y: auto; padding: 10px; }
        
        .section-title { font-size: 0.75rem; text-transform: uppercase; color: #71717a; margin: 15px 5px 5px 5px; font-weight: bold; }
        .channel-btn { width: 100%; padding: 10px; border-radius: 6px; background: transparent; color: #a1a1aa; border: none; text-align: left; cursor: pointer; font-size: 0.9rem; margin-bottom: 2px; transition: background 0.15s, color 0.15s; }
        .channel-btn:hover, .channel-btn.active { background: #27272a; color: #fff; }
        .channel-btn.global { font-weight: bold; color: var(--accent); }

        .messages-scroll { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        
        /* Анимация переключения каналов (scale-down) */
        #messages-list { display: flex; flex-direction: column; gap: 12px; transition: transform 0.18s ease, opacity 0.18s ease; transform-origin: center top; }
        #messages-list.loading { transform: scale(0.97); opacity: 0.4; }

        .notice-banner { background: #18181b; border: 1px solid #27272a; color: #71717a; padding: 10px; border-radius: 6px; text-align: center; font-size: 0.8rem; margin-bottom: 10px; }

        /* Разделитель дат */
        .date-divider { display: flex; align-items: center; text-align: center; margin: 15px 0 5px 0; color: #71717a; font-size: 0.75rem; font-weight: 600; text-transform: capitalize; }
        .date-divider::before, .date-divider::after { content: ''; flex: 1; border-bottom: 1px solid #27272a; }
        .date-divider span { padding: 0 12px; }

        /* Карточка сообщения */
        .msg { background: #18181b; padding: 10px 14px; border-radius: 8px; max-width: 80%; width: fit-content; border: 1px solid #27272a; }
        .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .msg-author { font-size: 0.85rem; font-weight: bold; color: var(--accent); }
        .msg-source { font-size: 0.65rem; color: #71717a; font-weight: normal; }
        .msg-time { font-size: 0.7rem; color: #52525b; margin-left: auto; }
        .msg-content { font-size: 0.9rem; color: #e4e4e7; line-height: 1.4; word-break: break-word; }

        .chat-input-area { padding: 15px; background: #18181b; border-top: 1px solid #27272a; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; background: #09090b; border: 1px solid #27272a; padding: 12px; border-radius: 6px; color: #fff; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: var(--accent); }
        .btn { background: var(--accent); color: #000; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .create-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 1.4rem; line-height: 1; padding: 0 4px; display: none; }
    </style>
</head>
<body>

    <!-- CONTAINER 1: Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h4>💬 Kaeront Чат</h4>
            <button id="add-channel-btn" class="create-btn" onclick="createChannelPrompt()" title="Создать канал">+</button>
        </div>
        <div class="channels-scroll">
            <div id="active-channels"></div>
            <div class="section-title">— Старые каналы —</div>
            <div id="old-channels"></div>
        </div>
    </div>

    <!-- CONTAINER 2: Main Chat -->
    <div id="chat-main">
        <div class="messages-scroll" id="msg-container">
            <div class="notice-banner">
                Отображены последние 100 сообщений, но мы будем увеличивать лимит со временем.
            </div>
            <div id="messages-list"></div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="Написать сообщение (Интервал 2 сек)..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button class="btn" onclick="sendMsg()">Отправить</button>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('kaeront_access_token');
        let currentChannel = 'global';
        let userHasScrolledUp = false;
        let lastMessagesHash = "";

        // Проверка авторизации при старте: показываем '+' только зарегистрированным
        if (token) {
            const addBtn = document.getElementById('add-channel-btn');
            if (addBtn) addBtn.style.display = 'block';
        }

        // Отслеживаем скролл пользователя
        const container = document.getElementById('msg-container');
        container.addEventListener('scroll', () => {
            // Если пользователь недоскроллил до низа больше 60px — скролл заблокирован
            const distanceToBottom = container.scrollHeight - container.scrollTop - container.clientHeight;
            userHasScrolledUp = distanceToBottom > 60;
        });

        async function api(path, method = 'GET', body = null) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            try {
                const res = await fetch(`/api/chat?path=${path}`, { method, headers, body: body ? JSON.stringify(body) : null });
                return await res.json();
            } catch (e) {
                return { error: true };
            }
        }

        async function loadChannels() {
            const data = await api('channels');
            if(!data.channels) return;

            const activeDiv = document.getElementById('active-channels');
            const oldDiv = document.getElementById('old-channels');
            activeDiv.innerHTML = ''; oldDiv.innerHTML = '';

            const oneDayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);

            data.channels.forEach(ch => {
                const btn = document.createElement('button');
                btn.className = `channel-btn ${ch.id === 'global' ? 'global' : ''} ${ch.id === currentChannel ? 'active' : ''}`;
                btn.innerText = `# ${ch.name}`;
                btn.onclick = () => switchChannel(ch.id);

                const lastAct = ch.last_activity ? new Date(ch.last_activity) : new Date(ch.created_at);
                if (lastAct < oneDayAgo && ch.id !== 'global') {
                    oldDiv.appendChild(btn);
                } else {
                    activeDiv.appendChild(btn);
                }
            });
        }

        async function loadMessages(isChannelSwitch = false) {
            const list = document.getElementById('messages-list');
            
            // Анимация scale-down при смене канала
            if (isChannelSwitch) {
                list.classList.add('loading');
            }

            const data = await api(`channels/${currentChannel}/messages`);
            if (!data.messages) {
                if (isChannelSwitch) list.classList.remove('loading');
                return;
            }

            // Быстрый хэш для предотвращения перерисовки одинаковых данных
            const currentHash = JSON.stringify(data.messages);
            if (currentHash === lastMessagesHash && !isChannelSwitch) {
                return;
            }
            lastMessagesHash = currentHash;

            // Группировка сообщений по датам с учетом локального часового пояса
            let htmlBuffer = "";
            let lastDateStr = "";

            data.messages.forEach(m => {
                // Преобразуем формат из "YYYY-MM-DD HH:MM:SS" в валидный ISO UTC "YYYY-MM-DDTHH:MM:SSZ"
                const isoUtcString = m.created_at.includes('T') 
                    ? (m.created_at.endsWith('Z') ? m.created_at : m.created_at + 'Z')
                    : m.created_at.replace(' ', 'T') + 'Z';

                const dateObj = new Date(isoUtcString);
                
                // Форматирование даты
                const dateStr = dateObj.toLocaleDateString('ru-RU', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                // Разделитель дат
                if (dateStr !== lastDateStr) {
                    htmlBuffer += `
                        <div class="date-divider">
                            <span>${escapeHtml(dateStr)}</span>
                        </div>
                    `;
                    lastDateStr = dateStr;
                }

                // Время
                const timeStr = dateObj.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                const timeAgoStr = getTimeAgo(dateObj);

                htmlBuffer += `
                    <div class="msg">
                        <div class="msg-header">
                            <span class="msg-author">${escapeHtml(m.author_name)}</span>
                            <span class="msg-source">• ${m.source === 'game' ? 'из игры' : 'с сайта'}</span>
                            <span class="msg-time" title="${escapeHtml(dateObj.toLocaleString('ru-RU'))}">${timeStr} (${timeAgoStr})</span>
                        </div>
                        <div class="msg-content">${escapeHtml(m.content)}</div>
                    </div>
                `;
            });

            list.innerHTML = htmlBuffer;

            // Снятие анимации загрузки
            if (isChannelSwitch) {
                setTimeout(() => list.classList.remove('loading'), 50);
            }

            // Автоскролл только если пользователь не листает историю вверх
            if (!userHasScrolledUp || isChannelSwitch) {
                container.scrollTop = container.scrollHeight;
                if (isChannelSwitch) userHasScrolledUp = false;
            }
        }

        async function sendMsg() {
            const input = document.getElementById('msg-input');
            const content = input.value.trim();
            if (!content) return;

            const res = await api(`channels/${currentChannel}/messages`, 'POST', { content, source: 'site' });
            if (res.detail) {
                alert(typeof res.detail === 'string' ? res.detail : JSON.stringify(res.detail));
                return;
            }
            
            input.value = '';
            userHasScrolledUp = false; // Позволяем принудительно проскроллить вниз при отправке своего сообщения
            await loadMessages();
        }

        async function createChannelPrompt() {
            if (!token) return alert("Создавать каналы могут только авторизованные пользователи!");
            const id = prompt("Введите ID нового канала (только буквы, цифры, _ и -):");
            if (!id) return;

            const res = await api('channels', 'POST', { id });
            if (res.detail) {
                alert(typeof res.detail === 'string' ? res.detail : JSON.stringify(res.detail));
                return;
            }
            switchChannel(res.channel_id);
        }

        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 30) return "только что";
            if (seconds < 60) return `${seconds} сек. назад`;
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} мин. назад`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} ч. назад`;
            const days = Math.floor(hours / 24);
            return `${days} дн. назад`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
        }

        function getChannelFromUrl() {
            const path = window.location.pathname.replace(/^\/+|\/+$/g, '');
            return path ? decodeURIComponent(path).toLowerCase() : 'global';
        }

        async function switchChannel(id, pushHistory = true) {
            currentChannel = id;
            lastMessagesHash = "";

            if (pushHistory && window.location.pathname !== `/${id}`) {
                const newPath = id === 'global' ? '/' : `/${id}`;
                history.pushState({ channel: id }, '', newPath);
            }

            loadChannels();
            await loadMessages(true);
        }

        window.addEventListener('popstate', (e) => {
            const channelFromState = e.state ? e.state.channel : getChannelFromUrl();
            switchChannel(channelFromState, false);
        });

        // Старт приложения и быстрая синхронизация каждые 1.5 секунды
        window.addEventListener('DOMContentLoaded', () => {
            const initialChannel = getChannelFromUrl();
            switchChannel(initialChannel, false);
            setInterval(() => loadMessages(false), 1500);
        });
    </script>
</body>
</html>
