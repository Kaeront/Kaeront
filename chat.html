<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaeront | Чат</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/assets/global.js"></script>
    <style>
        :root { --accent: #FFAA00; --bg: #0e0e10; --sidebar-bg: #18181b; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', system-ui, -apple-system, sans-serif; height: 100vh; overflow: hidden; display: flex; }

        #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 10; }

        /* Sidebar */
        #sidebar { width: 260px; background: var(--sidebar-bg); display: flex; flex-direction: column; border-right: 1px solid #27272a; height: 100vh; z-index: 20; transition: transform 0.25s ease; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #27272a; display: flex; justify-content: space-between; align-items: center; }
        .channels-scroll { flex: 1; overflow-y: auto; padding: 10px; }
        
        .section-title { font-size: 0.75rem; text-transform: uppercase; color: #71717a; margin: 15px 5px 5px 5px; font-weight: bold; }
        .channel-btn { width: 100%; padding: 10px; border-radius: 6px; background: transparent; color: #a1a1aa; border: none; text-align: left; cursor: pointer; font-size: 0.9rem; margin-bottom: 2px; transition: background 0.15s; position: relative; }
        .channel-btn:hover, .channel-btn.active { background: #27272a; color: #fff; }
        .channel-btn.global { font-weight: bold; color: var(--accent); }
        .channel-btn-inner { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; }
        .channel-btn-top { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .channel-btn-name { font-weight: 600; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .channel-btn-meta { font-size: 0.7rem; color: #71717a; display: flex; align-items: center; gap: 4px; }
        .channel-btn-meta img { width: 12px; height: 12px; border-radius: 50%; }

        /* Иконка троеточия и Меню */
        .channel-more-btn { background: none; border: none; color: #71717a; cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: 1rem; line-height: 1; opacity: 0; transition: opacity 0.15s, color 0.15s; }
        .channel-btn:hover .channel-more-btn { opacity: 1; }
        .channel-more-btn:hover { color: #fff; background: #3f3f46; }

        .chat-dropdown-menu { position: absolute; right: 10px; top: 35px; background: #18181b; border: 1px solid #27272a; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 100; display: none; flex-direction: column; min-width: 150px; overflow: hidden; }
        .chat-dropdown-menu.active { display: flex; }
        .chat-dropdown-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: transparent; border: none; color: #e4e4e7; font-size: 0.85rem; cursor: pointer; text-align: left; transition: background 0.15s; }
        .chat-dropdown-item:hover { background: #27272a; color: #fff; }
        .chat-dropdown-item svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

        /* Чат бокс */
        #chat-main { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; width: 100%; }

        /* Шапка текущего канала */
        .chat-header { padding: 12px 20px; background: #18181b; border-bottom: 1px solid #27272a; display: flex; align-items: center; gap: 12px; }
        .mobile-menu-btn { display: none; background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; }
        .channel-title-box { display: flex; flex-direction: column; }
        .channel-title-name { font-size: 1rem; font-weight: bold; color: #fff; }
        .channel-creator-info { font-size: 0.75rem; color: #a1a1aa; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
        .channel-creator-avatar { width: 16px; height: 16px; border-radius: 50%; object-fit: cover; }
        .creator-link { color: var(--accent); text-decoration: none; font-weight: 600; }
        .creator-link:hover { text-decoration: underline; }

        /* Контейнер сообщений */
        .messages-scroll { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
        #messages-list { display: flex; flex-direction: column; gap: 14px; transition: transform 0.18s ease, opacity 0.18s ease; transform-origin: center top; }
        #messages-list.loading { transform: scale(0.97); opacity: 0.4; }

        .notice-banner { background: #18181b; border: 1px solid #27272a; color: #71717a; padding: 10px; border-radius: 6px; text-align: center; font-size: 0.8rem; margin-bottom: 10px; }

        /* Разделитель по датам */
        .date-divider { display: flex; align-items: center; text-align: center; margin: 10px 0; color: #71717a; font-size: 0.75rem; font-weight: 600; text-transform: capitalize; }
        .date-divider::before, .date-divider::after { content: ''; flex: 1; border-bottom: 1px solid #27272a; }
        .date-divider span { padding: 0 12px; }

        /* Структура карточки сообщения с аватаркой слева */
        .msg-row { display: flex; gap: 12px; align-items: flex-start; max-width: 85%; }
        .msg-avatar-link { flex-shrink: 0; text-decoration: none; }
        .msg-avatar { width: 38px; height: 38px; border-radius: 50%; background: #27272a; object-fit: cover; border: 1px solid #3f3f46; transition: transform 0.15s; }
        .msg-avatar:hover { transform: scale(1.08); }

        .msg-body { background: #18181b; padding: 10px 14px; border-radius: 8px; border: 1px solid #27272a; flex: 1; min-width: 0; }
        .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
        .msg-author-link { font-size: 0.85rem; font-weight: bold; color: var(--accent); text-decoration: none; }
        .msg-author-link:hover { text-decoration: underline; }
        .msg-source { font-size: 0.65rem; color: #71717a; font-weight: normal; }
        .msg-time { font-size: 0.7rem; color: #52525b; margin-left: auto; }
        .msg-content { font-size: 0.9rem; color: #e4e4e7; line-height: 1.4; word-break: break-word; }

        /* Поле ввода и блок гостя */
        .chat-input-area { padding: 15px; background: #18181b; border-top: 1px solid #27272a; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; background: #09090b; border: 1px solid #27272a; padding: 12px; border-radius: 6px; color: #fff; outline: none; }
        input[type="text"]:focus { border-color: var(--accent); }
        .btn { background: var(--accent); color: #000; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .guest-notice-box { width: 100%; padding: 14px; background: #09090b; border: 1px dashed #27272a; border-radius: 6px; text-align: center; color: #71717a; font-size: 0.85rem; }
        .guest-notice-box a { color: var(--accent); text-decoration: none; font-weight: bold; }
        .guest-notice-box a:hover { text-decoration: underline; }

        .create-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 1.4rem; line-height: 1; display: none; }

        /* Модалка Стриминга */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 24px; max-width: 480px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .modal-title { font-size: 1.1rem; font-weight: bold; color: #fff; margin-bottom: 8px; }
        .modal-desc { font-size: 0.85rem; color: #a1a1aa; margin-bottom: 16px; line-height: 1.4; }
        .modal-input-group { display: flex; gap: 8px; margin-bottom: 20px; }
        .modal-input-group input { flex: 1; background: #09090b; border: 1px solid #27272a; padding: 10px; border-radius: 6px; color: #fff; font-size: 0.85rem; }

        /* Стриминг Режим */
        body.streaming-mode #sidebar,
        body.streaming-mode .chat-header,
        body.streaming-mode .notice-banner,
        body.streaming-mode .chat-input-area { display: none !important; }
        body.streaming-mode { background: transparent !important; }
        body.streaming-mode #chat-main { background: transparent !important; }
        body.streaming-mode .msg-body { background: rgba(24, 24, 27, 0.85); backdrop-filter: blur(8px); }

        /* Мобильная адаптация (@media) */
        @media (max-width: 768px) {
            #sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            .mobile-menu-btn { display: block; }
            .msg-row { max-width: 95%; }
        }
    </style>
</head>
<body>

    <div id="sidebar-overlay" onclick="toggleMobileSidebar(false)"></div>

    <!-- CONTAINER 1: Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h4>💬 Kaeront Чат</h4>
            <button id="add-channel-btn" class="create-btn" onclick="createChannelPrompt()" title="Создать канал">+</button>
        </div>
        <div class="channels-scroll">
            <div id="active-channels"></div>
            <div class="section-title">— Старые каналы —</div>
            <div id="old-channels"></div>
        </div>
    </div>

    <!-- CONTAINER 2: Main Chat -->
    <div id="chat-main">
        <div class="chat-header">
            <button class="mobile-menu-btn" onclick="toggleMobileSidebar(true)">☰</button>
            <div class="channel-title-box">
                <span class="channel-title-name" id="header-channel-name"># global</span>
                <div class="channel-creator-info" id="header-creator-info"></div>
            </div>
        </div>

        <div class="messages-scroll" id="msg-container">
            <div class="notice-banner">
                Отображены последние 100 сообщений, но мы будем увеличивать лимит со временем.
            </div>
            <div id="messages-list"></div>
        </div>

        <div class="chat-input-area" id="input-area-container"></div>
    </div>

    <!-- Dropdown Menu Template -->
    <div id="chat-context-menu" class="chat-dropdown-menu">
        <button class="chat-dropdown-item" onclick="togglePinChannel()">
            <svg viewBox="0 0 24 24"><path d="M16 12V4H17V2H7V4H8V12L6 14V16H11V22H13V16H18V14L16 12Z"/></svg>
            <span id="pin-text">Закрепить</span>
        </button>
        <button class="chat-dropdown-item" onclick="toggleListenChannel()">
            <svg viewBox="0 0 24 24"><path d="M12 2A10 10 0 0 0 2 12A10 10 0 0 0 12 22A10 10 0 0 0 22 12A10 10 0 0 0 12 2M11 7H13V9H11V7M11 11H13V17H11V11Z"/></svg>
            <span id="listen-text">Слушать</span>
        </button>
        <button class="chat-dropdown-item" onclick="openStreamModal()">
            <svg viewBox="0 0 24 24"><path d="M20,18H4V6H20M20,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H9V22H15V20H20A2,2 0 0,0 22,18V6C22,4.89 21.1,4 20,4Z"/></svg>
            <span>Стримить...</span>
        </button>
    </div>

    <!-- Modal Streaming -->
    <div class="modal-overlay" id="stream-modal">
        <div class="modal-card">
            <div class="modal-title">Виджет для OBS / Стриминга</div>
            <div class="modal-desc">Вставьте эту ссылку в качестве источника браузера (Browser Source) в вашем OBS Studio. Чат будет прозрачным и сфокусирован только на сообщениях.</div>
            <div class="modal-input-group">
                <input type="text" id="stream-url-input" readonly>
                <button class="btn" onclick="copyStreamUrl()">Копировать</button>
            </div>
            <div style="text-align: right;">
                <button class="btn" style="background:#27272a; color:#fff;" onclick="closeStreamModal()">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('kaeront_access_token');
        let currentChannel = 'global';
        let userHasScrolledUp = false;
        let lastMessagesHash = "";
        let knownMessageIds = new Set();
        let isFirstLoad = true;
        let channelsCache = [];
        let selectedMenuChannel = null;

        // Пин / Прослушивание
        let pinnedChannels = JSON.parse(localStorage.getItem('kaeront_pinned_channels') || '[]');
        let listenedChannels = JSON.parse(localStorage.getItem('kaeront_listened_channels') || '[]');

        // Проверка режима стриминга ?streaming
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('streaming')) {
            document.body.classList.add('streaming-mode');
        }

        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        window.addEventListener('DOMContentLoaded', () => {
            const inputContainer = document.getElementById('input-area-container');
            const addBtn = document.getElementById('add-channel-btn');

            if (token) {
                if (addBtn) addBtn.style.display = 'block';
                inputContainer.innerHTML = `
                    <input type="text" id="msg-input" placeholder="Написать сообщение (Интервал 2 сек)..." onkeydown="if(event.key==='Enter') sendMsg()">
                    <button class="btn" onclick="sendMsg()">Отправить</button>
                `;
            } else {
                if (addBtn) addBtn.style.display = 'none';
                inputContainer.innerHTML = `
                    <div class="guest-notice-box">
                        Чтобы отправить сообщение или создать канал вам нужно <a href="https://kaeront.ru/login">авторизоваться</a>.
                    </div>
                `;
            }

            const initialChannel = getChannelFromUrl();
            switchChannel(initialChannel, false);
            setInterval(() => loadMessages(false), 1500);

            // Закрытие меню при клике мимо
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.channel-more-btn') && !e.target.closest('#chat-context-menu')) {
                    document.getElementById('chat-context-menu').classList.remove('active');
                }
            });
        });

        const container = document.getElementById('msg-container');
        container.addEventListener('scroll', () => {
            const distanceToBottom = container.scrollHeight - container.scrollTop - container.clientHeight;
            userHasScrolledUp = distanceToBottom > 60;
        });

        async function api(path, method = 'GET', body = null) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            try {
                const res = await fetch(`/api/chat?path=${path}`, { method, headers, body: body ? JSON.stringify(body) : null });
                return await res.json();
            } catch (e) {
                return { error: true };
            }
        }

        async function loadChannels() {
            const data = await api('channels');
            if(!data.channels) return;
            channelsCache = data.channels;

            const activeDiv = document.getElementById('active-channels');
            const oldDiv = document.getElementById('old-channels');
            activeDiv.innerHTML = ''; oldDiv.innerHTML = '';

            data.channels.forEach(ch => {
                const btn = document.createElement('button');
                btn.className = `channel-btn ${ch.id === 'global' ? 'global' : ''} ${ch.id === currentChannel ? 'active' : ''}`;
                
                const isSystem = ch.id === 'global' || !ch.created_by_name;
                const creatorName = isSystem ? 'Система' : ch.created_by_name;
                const avatarUrl = getAvatarUrl(ch.created_by, creatorName);
                
                btn.innerHTML = `
                    <div class="channel-btn-inner">
                        <div class="channel-btn-top">
                            <span class="channel-btn-name"># ${escapeHtml(ch.name)}</span>
                            <button class="channel-more-btn" onclick="toggleContextMenu(event, '${ch.id}')">⋮</button>
                        </div>
                        <div class="channel-btn-meta">
                            <img src="${avatarUrl}" alt="">
                            <span>${escapeHtml(creatorName)}</span>
                        </div>
                    </div>
                `;
                
                btn.onclick = (e) => {
                    if (e.target.classList.contains('channel-more-btn')) return;
                    toggleMobileSidebar(false);
                    switchChannel(ch.id);
                };
            
                const lastAct = ch.last_activity ? new Date(ch.last_activity) : new Date(ch.created_at);
                const oneDayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
                if (lastAct < oneDayAgo && ch.id !== 'global') {
                    oldDiv.appendChild(btn);
                } else {
                    activeDiv.appendChild(btn);
                }
            });
            updateHeaderInfo();
        }

        function toggleContextMenu(e, channelId) {
            e.stopPropagation();
            selectedMenuChannel = channelId;
            const menu = document.getElementById('chat-context-menu');
            
            const isPinned = pinnedChannels.includes(channelId);
            const isListened = listenedChannels.includes(channelId);

            document.getElementById('pin-text').innerText = isPinned ? 'Открепить' : 'Закрепить';
            document.getElementById('listen-text').innerText = isListened ? 'Перестать слушать' : 'Слушать';

            const rect = e.target.getBoundingClientRect();
            menu.style.top = `${rect.bottom + window.scrollY}px`;
            menu.style.left = `${rect.left + window.scrollX - 120}px`;
            menu.classList.toggle('active');
        }

        function togglePinChannel() {
            if (!selectedMenuChannel) return;
            if (pinnedChannels.includes(selectedMenuChannel)) {
                pinnedChannels = pinnedChannels.filter(id => id !== selectedMenuChannel);
            } else {
                pinnedChannels.push(selectedMenuChannel);
            }
            localStorage.setItem('kaeront_pinned_channels', JSON.stringify(pinnedChannels));
            document.getElementById('chat-context-menu').classList.remove('active');
        }

        function toggleListenChannel() {
            if (!selectedMenuChannel) return;
            if (listenedChannels.includes(selectedMenuChannel)) {
                listenedChannels = listenedChannels.filter(id => id !== selectedMenuChannel);
            } else {
                listenedChannels.push(selectedMenuChannel);
            }
            localStorage.setItem('kaeront_listened_channels', JSON.stringify(listenedChannels));
            document.getElementById('chat-context-menu').classList.remove('active');
        }

        function openStreamModal() {
            if (!selectedMenuChannel) return;
            const url = `https://chat.kaeront.ru/${selectedMenuChannel}?streaming`;
            document.getElementById('stream-url-input').value = url;
            document.getElementById('stream-modal').classList.add('active');
            document.getElementById('chat-context-menu').classList.remove('active');
        }

        function closeStreamModal() {
            document.getElementById('stream-modal').classList.remove('active');
        }

        function copyStreamUrl() {
            const input = document.getElementById('stream-url-input');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert('Ссылка для стрима скопирована в буфер обмена!');
        }

        function updateHeaderInfo() {
            document.getElementById('header-channel-name').innerText = `# ${currentChannel}`;
            const creatorInfoDiv = document.getElementById('header-creator-info');
            
            const chData = channelsCache.find(c => c.id === currentChannel);
            if (chData && chData.created_by_name && chData.id !== 'global') {
                const avatarUrl = getAvatarUrl(chData.created_by, chData.created_by_name);
                creatorInfoDiv.innerHTML = `
                    Создатель: 
                    <img src="${avatarUrl}" class="channel-creator-avatar" alt="">
                    <a href="https://kaeront.ru/user/${encodeURIComponent(chData.created_by_name)}" target="_blank" class="creator-link">
                        ${escapeHtml(chData.created_by_name)}
                    </a>
                `;
            } else {
                creatorInfoDiv.innerHTML = `Официальный системный канал`;
            }
        }

        async function loadMessages(isChannelSwitch = false) {
            const list = document.getElementById('messages-list');
            if (isChannelSwitch) list.classList.add('loading');

            const data = await api(`channels/${currentChannel}/messages`);
            if (!data.messages) {
                if (isChannelSwitch) list.classList.remove('loading');
                return;
            }

            if (!isFirstLoad && !isChannelSwitch) {
                let hasNew = false;
                let lastMsg = null;
                data.messages.forEach(m => {
                    if (!knownMessageIds.has(m.id)) {
                        hasNew = true;
                        lastMsg = m;
                    }
                });

                if (hasNew && lastMsg) {
                    playNotificationSound();
                    if (document.hidden && Notification.permission === 'granted') {
                        new Notification(`Новое сообщение в #${currentChannel}`, {
                            body: `${lastMsg.author_name}: ${lastMsg.content}`,
                            icon: getAvatarUrl(lastMsg.author_uuid, lastMsg.author_name)
                        });
                    }
                }
            }

            data.messages.forEach(m => knownMessageIds.add(m.id));
            isFirstLoad = false;

            const currentHash = JSON.stringify(data.messages);
            if (currentHash === lastMessagesHash && !isChannelSwitch) return;
            lastMessagesHash = currentHash;

            let htmlBuffer = "";
            let lastDateStr = "";

            data.messages.forEach(m => {
                const isoUtcString = m.created_at.includes('T') 
                    ? (m.created_at.endsWith('Z') ? m.created_at : m.created_at + 'Z')
                    : m.created_at.replace(' ', 'T') + 'Z';

                const dateObj = new Date(isoUtcString);
                const dateStr = dateObj.toLocaleDateString('ru-RU', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

                if (dateStr !== lastDateStr) {
                    htmlBuffer += `<div class="date-divider"><span>${escapeHtml(dateStr)}</span></div>`;
                    lastDateStr = dateStr;
                }

                const timeStr = dateObj.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                const timeAgoStr = getTimeAgo(dateObj);
                const userProfileUrl = `https://kaeront.ru/user/${encodeURIComponent(m.author_name)}`;
                const avatarUrl = getAvatarUrl(m.author_uuid, m.author_name);

                htmlBuffer += `
                    <div class="msg-row">
                        <a href="${userProfileUrl}" target="_blank" class="msg-avatar-link">
                            <img src="${avatarUrl}" class="msg-avatar" alt="${escapeHtml(m.author_name)}" loading="lazy">
                        </a>
                        <div class="msg-body">
                            <div class="msg-header">
                                <a href="${userProfileUrl}" target="_blank" class="msg-author-link">${escapeHtml(m.author_name)}</a>
                                <span class="msg-source">• ${m.source === 'game' ? 'из игры' : 'с сайта'}</span>
                                <span class="msg-time" title="${escapeHtml(dateObj.toLocaleString('ru-RU'))}">${timeStr} (${timeAgoStr})</span>
                            </div>
                            <div class="msg-content">${escapeHtml(m.content)}</div>
                        </div>
                    </div>
                `;
            });

            list.innerHTML = htmlBuffer;
            if (isChannelSwitch) setTimeout(() => list.classList.remove('loading'), 50);

            if (!userHasScrolledUp || isChannelSwitch) {
                container.scrollTop = container.scrollHeight;
                if (isChannelSwitch) userHasScrolledUp = false;
            }
        }

        async function sendMsg() {
            const input = document.getElementById('msg-input');
            if(!input) return;
            const content = input.value.trim();
            if (!content) return;

            const res = await api(`channels/${currentChannel}/messages`, 'POST', { content, source: 'site' });
            if (res.detail) {
                alert(typeof res.detail === 'string' ? res.detail : JSON.stringify(res.detail));
                return;
            }
            
            input.value = '';
            userHasScrolledUp = false;
            await loadMessages();
        }

        async function createChannelPrompt() {
            if (!token) return alert("Создавать каналы могут только авторизованные пользователи!");
            const id = prompt("Введите ID нового канала (буквы, цифры, _ и -):");
            if (!id) return;

            const res = await api('channels', 'POST', { id });
            if (res.error) return alert("Ошибка сети или API.");
            if (res.detail) return alert(typeof res.detail === 'string' ? res.detail : JSON.stringify(res.detail));
            if (!res.channel_id) return alert("Сервер не вернул ID канала.");
            
            switchChannel(res.channel_id);
        }

        function getAvatarUrl(uuid, username) {
            if (uuid && uuid !== '00000000-0000-0000-0000-000000000000') {
                return `https://crafthead.net/avatar/${uuid.replace(/-/g, '')}`;
            }
            return `https://crafthead.net/avatar/${encodeURIComponent(username || 'Console')}`;
        }

        function playNotificationSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.25);
            } catch(e) {}
        }

        function toggleMobileSidebar(open) {
            document.getElementById('sidebar').classList.toggle('open', open);
            document.getElementById('sidebar-overlay').style.display = open ? 'block' : 'none';
        }

        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 30) return "только что";
            if (seconds < 60) return `${seconds} сек. назад`;
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} мин. назад`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} ч. назад`;
            return `${Math.floor(hours / 24)} дн. назад`;
        }

        function escapeHtml(str) {
            return str ? str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])) : '';
        }

        function getChannelFromUrl() {
            const path = window.location.pathname.replace(/^\/+|\/+$/g, '');
            return path && path !== 'chat' ? decodeURIComponent(path).toLowerCase() : 'global';
        }

        async function switchChannel(id, pushHistory = true) {
            currentChannel = id;
            lastMessagesHash = "";

            if (pushHistory) {
                const newPath = id === 'global' ? '/chat' : `/chat/${id}`;
                history.pushState({ channel: id }, '', newPath);
            }

            await loadChannels();
            document.getElementById('input-area-container').style.display = 'flex';

            if (id !== 'global' && channelsCache.length > 0 && !channelsCache.some(c => c.id === id)) {
                document.getElementById('header-channel-name').innerText = `# ${id}`;
                document.getElementById('header-creator-info').innerText = "Канал не найден";
                document.getElementById('messages-list').innerHTML = `
                    <div style="text-align:center; padding: 60px 20px; color: #ef4444;">
                        <h1 style="font-size: 4rem; margin-bottom: 10px;">404</h1>
                        <p style="color: #a1a1aa; font-size: 1.1rem; margin-bottom: 25px;">Канал <b>#${escapeHtml(id)}</b> не существует или был удалён.</p>
                        <button class="btn" onclick="switchChannel('global')">Вернуться в #global</button>
                    </div>
                `;
                document.getElementById('input-area-container').style.display = 'none';
                return;
            }

            await loadMessages(true);
        }

        window.addEventListener('popstate', (e) => {
            switchChannel(e.state ? e.state.channel : getChannelFromUrl(), false);
        });
    </script>
</body>
</html>
